name: CI

on:
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR when new commits are pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-guard:
    name: Release version guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Validate release version and tag uniqueness
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/ci-release-guard.sh

  build:
    name: Build & verify
    uses: ./.github/workflows/build.yml
    with:
      image-name: sample-nodejs
      image-version: pr-${{ github.event.pull_request.number }}
      push: false
