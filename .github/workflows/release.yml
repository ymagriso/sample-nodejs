name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "eslint.config.js"
      - "test/**"
      - ".github/dependabot.yml"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/trivy-scan.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/deploy.yml"

# Serialize releases on main so concurrent merges cannot collide on versions/tags
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Resolve version and sync chart metadata
        id: version
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/resolve-release-version.sh

  build-and-push:
    name: Build, test & push OCI artifacts
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      image-name: devops-demo
      image-version: ${{ needs.prepare.outputs.version }}
      push: true
    secrets: inherit

  tag:
    name: Create release Git tag
    needs: [prepare, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sample-nodejs
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Create and push release tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/create-release-tag.sh

  deploy:
    name: Deploy to k8s-resources
    needs: [prepare, build-and-push, tag]
    if: github.run_attempt == '1'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  deploy-skipped:
    name: Deploy status (re-run)
    needs: [prepare, build-and-push, tag]
    if: github.run_attempt != '1' && needs.tag.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout sample-nodejs
        uses: actions/checkout@v7.0.1

      - name: Write deploy-skipped notice
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ATTEMPT: ${{ github.run_attempt }}
        run: .github/scripts/write-deploy-skipped-summary.sh
